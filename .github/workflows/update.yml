name: Update ROH opera calendars

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Generate calendars (fail closed if incomplete)
        run: python update_calendar.py
      - name: Commit updated calendars
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add royal-opera-house.ics royal-opera-house-sales.ics
          if ! git diff --cached --quiet; then
            git commit -m 'Update ROH calendars'
            git push
          fi
